<style>
/* Crabbis tur: one playable daily tour (map, Kloen, Ruten in two steps, Nettet, fight against today's foe, catch, stop).
   Layouts and backgrounds come from design/screens/screens-v2.src.html, which Steve chose on 2026-11-08:
   look A for the stops (the maths lives in the place), look B for the fight (stage on top, white task panel below).
   The game is drawn on a fixed 1280x800 stage that scales to fit the tablet. */
:root{
  --navy:#1b3150; --white:#fffdf8; --coral:#ef6a43; --coral-dk:#c94c29; --bolt:#ffd84a; --good:#3bb36b;
  --num:"Fredoka","Baloo 2","Trebuchet MS",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#cfe9f2;overflow:hidden;font-family:var(--num);color:var(--navy);user-select:none;-webkit-user-select:none;touch-action:manipulation}
#viewport{position:fixed;inset:0;display:grid;place-items:center}
#stage{position:relative;width:1280px;height:800px;overflow:hidden;flex:none;transform-origin:center;background:var(--white)}
#stage.fade{opacity:0}
#stage{transition:opacity .28s ease}
.screen{position:absolute;inset:0}
.bg{position:absolute;inset:0}
.bg svg{width:100%;height:100%;display:block}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
.abs{position:absolute}

/* HUD */
.speaker{position:absolute;left:28px;top:24px;width:76px;height:76px;border-radius:50%;background:var(--white);border:4px solid var(--navy);display:grid;place-items:center;box-shadow:0 5px 0 var(--navy);z-index:20}
.speaker svg{width:40px;height:40px}
.speaker:active{transform:translateY(4px);box-shadow:0 1px 0 var(--navy)}
.steps{position:absolute;top:40px;left:50%;transform:translateX(-50%);display:flex;gap:14px;align-items:center;z-index:20}
.steps i{width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.6);border:4px solid var(--navy)}
.steps i.done{background:var(--coral)}
.steps i.now{width:34px;height:34px;background:var(--white);box-shadow:0 0 0 6px rgba(255,255,255,.5)}
.steps b{width:44px;height:44px;border-radius:12px;background:var(--white);border:4px solid var(--navy);display:grid;place-items:center}
.steps b.now{background:var(--bolt);box-shadow:0 0 0 6px rgba(255,255,255,.5)}
.pips{position:absolute;top:96px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:20}
.pips i{width:14px;height:14px;border-radius:50%;background:rgba(27,49,80,.18)}
.pips i.done{background:var(--good)}
.pips i.now{background:var(--white);box-shadow:0 0 0 3px var(--navy)}

/* Look A pieces */
.glossy{position:absolute;border-radius:50%;display:grid;place-items:center;font-weight:700;color:var(--navy);
  background:radial-gradient(circle at 32% 28%,#fff 0 10%,rgba(255,255,255,.78) 11% 30%,rgba(196,238,255,.8) 31% 100%);
  border:5px solid rgba(255,255,255,.95);box-shadow:0 8px 0 rgba(27,49,80,.16),inset 0 -10px 18px rgba(44,143,198,.3)}
.tag{position:absolute;padding:6px 18px;border-radius:999px;background:var(--coral);color:var(--white);font-weight:700;border:5px solid var(--white);box-shadow:0 6px 0 var(--coral-dk)}
.answers{position:absolute;display:flex;gap:30px;z-index:5}
.shell{width:150px;height:130px;display:grid;place-items:center;font-size:60px;font-weight:700;color:var(--navy);
  background:radial-gradient(circle at 50% 110%,#ffd9c7,#fff3ea 60%);border:6px solid var(--navy);border-radius:50% 50% 46% 46%/60% 60% 40% 40%;box-shadow:0 9px 0 var(--navy);transition:opacity .3s,filter .3s}
.help{width:96px;height:96px;border-radius:50%;background:var(--white);border:5px solid var(--navy);display:grid;place-items:center;font-size:52px;font-weight:700;box-shadow:0 7px 0 var(--navy);align-self:center}
.shell:active,.help:active,.btn:active,.pad:active{transform:translateY(5px);box-shadow:0 3px 0 var(--navy)}
.stone{position:absolute;width:130px;height:130px;border-radius:50%;display:grid;place-items:center;font-size:58px;font-weight:700;background:var(--white);border:6px solid var(--navy);box-shadow:0 8px 0 var(--navy)}
.goal{position:absolute;width:170px;height:170px;border-radius:50%;display:grid;place-items:center;font-size:76px;font-weight:700;background:radial-gradient(circle at 35% 30%,#fff7c8,var(--bolt) 70%);border:6px solid var(--navy);box-shadow:0 8px 0 var(--navy),0 0 0 14px rgba(255,216,74,.35)}
.pad{position:absolute;width:150px;height:108px;display:grid;place-items:center;font-size:46px;font-weight:700;color:var(--navy);
  background:radial-gradient(ellipse at 35% 30%,#e2f9bd,#9ad66c 70%);border:5px solid #3f8a3c;border-radius:60% 40% 55% 45%/55% 50% 50% 45%;box-shadow:0 8px 0 rgba(40,90,40,.35);transition:opacity .3s,filter .3s;z-index:3}
.foe-pic{position:absolute;border-radius:50%;overflow:hidden;border:7px solid var(--white);box-shadow:0 10px 0 rgba(27,49,80,.16),0 0 0 10px rgba(255,255,255,.28)}
.foe-pic img{width:100%;height:100%;object-fit:cover;display:block}
.net{position:absolute;border:5px dashed rgba(27,49,80,.7);border-radius:30px;background:rgba(255,255,255,.35);transition:background .3s,box-shadow .3s}
.net.lit{background:rgba(255,236,150,.75);box-shadow:0 0 0 8px rgba(255,216,74,.45)}
.bucket{position:absolute}
.netlabel{position:absolute;top:-58px;left:50%;transform:translateX(-50%) scale(.4);opacity:0;padding:2px 16px;border-radius:999px;background:var(--navy);color:var(--white);font-size:36px;font-weight:700;transition:transform .25s,opacity .25s}
.lit .netlabel,.netlabel.on{transform:translateX(-50%) scale(1);opacity:1}
svg.fish{position:absolute;overflow:visible;transition:transform .25s}
svg.fish.pop{transform:scale(1.35)}
.count{position:absolute;padding:2px 12px;border-radius:999px;background:var(--navy);color:var(--white);font-size:26px;font-weight:700;transform:translate(-50%,-110%)}
.crab{position:absolute;z-index:4}
.foe-rig{position:absolute;z-index:3}

/* States */
.right{background:radial-gradient(circle at 50% 110%,#bff0cf,#eafff0 60%)!important;border-color:var(--good)!important;box-shadow:0 9px 0 #23864a!important}
.pad.right{background:radial-gradient(ellipse at 35% 30%,#fff7c8,var(--bolt) 70%)!important;border-color:var(--navy)!important}
.miss{animation:shake .45s}
.out{opacity:.35;filter:grayscale(1);pointer-events:none}
@keyframes shake{20%{transform:translateX(-12px) rotate(-4deg)}40%{transform:translateX(10px) rotate(3deg)}60%{transform:translateX(-7px)}80%{transform:translateX(5px)}}
.glow{animation:glow 1s ease-in-out infinite alternate}
@keyframes glow{to{box-shadow:0 8px 0 var(--navy),0 0 0 26px rgba(255,216,74,.55)}}
.burst{position:absolute;pointer-events:none;z-index:30}

/* Hint card (look A) */
.hint{position:absolute;left:240px;top:118px;width:800px;padding:14px 22px 10px;background:var(--white);border:5px solid var(--navy);border-radius:28px;box-shadow:0 8px 0 var(--navy);z-index:15;animation:hintIn .3s ease-out}
@keyframes hintIn{from{transform:translateY(-20px);opacity:0}}
.hint svg{display:block;width:100%;height:auto}

/* Look B: fight */
.b-stage{position:absolute;left:0;right:0;top:0;height:520px;overflow:hidden}
.plat{position:absolute;border-radius:50%;background:rgba(255,255,255,.35);box-shadow:inset 0 -8px 0 rgba(27,49,80,.08)}
.card{position:absolute;background:var(--white);border:4px solid var(--navy);border-radius:18px;padding:10px 18px;min-width:260px;box-shadow:0 6px 0 var(--navy);z-index:6}
.card .nm{font-size:28px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:12px}
.card .nm small{font-size:16px;padding:2px 10px;border-radius:999px;color:#fff;transition:background .6s}
.card .x2{position:absolute;right:-26px;top:-24px;width:56px;height:56px;border-radius:50%;background:var(--bolt);border:4px solid var(--navy);display:grid;place-items:center;font-size:22px;font-weight:700;transform:scale(0);transition:transform .35s cubic-bezier(.3,1.6,.6,1)}
.card .x2.on{transform:scale(1)}
.hp{height:16px;border-radius:999px;background:#dfe7ee;border:3px solid var(--navy);overflow:hidden;margin-top:8px}
.hp i{display:block;height:100%;border-radius:999px;background:var(--good);transition:width .5s ease,background .5s}
.panel{position:absolute;left:0;right:0;bottom:0;height:280px;background:var(--white);border-top:6px solid var(--navy);display:grid;grid-template-columns:1fr 470px;gap:24px;padding:26px 30px 30px 120px}
.panel .speaker{left:26px;top:30px}
.task{position:relative;display:flex;align-items:center;justify-content:center;gap:20px;font-size:72px;font-weight:700;border-radius:24px;background:#eef6fb;border:4px solid #c9dcea;overflow:hidden}
.task .box{min-width:110px;height:110px;padding:0 10px;border-radius:24px;display:grid;place-items:center;background:var(--white);border:5px solid var(--navy)}
.task .claw{background:var(--coral);color:var(--white);border-color:var(--coral-dk)}
.task .gold{background:radial-gradient(circle at 35% 30%,#fff7c8,var(--bolt) 70%)}
.task .arr{font-size:52px;color:#7b93a8}
.task .hint-in{position:absolute;inset:0;background:#fff;display:grid;place-items:center;padding:8px 16px;animation:hintIn .3s ease-out}
.task .hint-in svg{width:100%;height:100%}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.btn{border-radius:22px;background:#ffe9b8;border:5px solid var(--navy);display:grid;place-items:center;font-size:56px;font-weight:700;box-shadow:0 7px 0 var(--navy);transition:opacity .3s,filter .3s}
.btn.hintb{background:var(--white);font-size:46px}
.btn.right{background:#c8f2d4!important}
.rings[hidden]{display:none}
.rings{position:absolute;left:870px;top:24px;display:flex;gap:14px;z-index:7}
.rings i{width:62px;height:62px;border-radius:50%;border:5px dashed var(--navy);background:rgba(255,255,255,.6);display:grid;place-items:center;transition:background .3s}
.rings i.got{border-style:solid;background:radial-gradient(circle at 32% 28%,#fff 0 12%,#bfeaff 40%,#62bafa)}
.rings i.lost{border-style:solid;background:#dfe7ee;opacity:.6}

/* Map */
.play{position:absolute;left:560px;top:620px;width:160px;height:140px;border-radius:70px;background:var(--coral);border:6px solid var(--navy);box-shadow:0 9px 0 var(--navy);display:grid;place-items:center;z-index:10}
.play svg{width:66px;height:66px}
.play.glow{animation:playglow 1.1s ease-in-out infinite alternate}
@keyframes playglow{to{box-shadow:0 9px 0 var(--navy),0 0 0 18px rgba(239,106,67,.35)}}
.mark{position:absolute;width:64px;height:64px;border-radius:50%;background:var(--white);border:5px solid var(--navy);display:grid;place-items:center;font-size:30px;font-weight:700;box-shadow:0 5px 0 var(--navy)}
.mark.fight{background:var(--bolt)}

/* End */
.book{position:absolute;left:680px;top:150px;width:470px;height:440px;background:#fff8e6;border:6px solid var(--navy);border-radius:26px;box-shadow:0 10px 0 var(--navy);overflow:hidden}
.book .slot{position:absolute;left:40px;top:40px;width:380px;height:300px;border-radius:20px;background:linear-gradient(#dff4fb 70%,#f2e3bb 70%)}
.book .nm{position:absolute;left:0;right:0;bottom:32px;text-align:center;font-size:44px;font-weight:700}
.stamp{position:absolute;right:26px;top:22px;width:86px;height:86px;border-radius:50%;background:var(--good);border:5px solid var(--navy);display:grid;place-items:center;transform:rotate(-12deg) scale(0);transition:transform .4s cubic-bezier(.3,1.6,.6,1)}
.stamp.on{transform:rotate(-12deg) scale(1)}
.ghost svg.foe-rig{filter:brightness(0) opacity(.18)}
.stars{position:absolute;left:150px;top:150px;display:flex;gap:16px}
.done-btn{position:absolute;left:560px;top:640px;width:160px;height:120px;border-radius:60px;background:var(--good);border:6px solid var(--navy);box-shadow:0 9px 0 var(--navy);display:grid;place-items:center}
.replay{position:absolute;right:22px;bottom:18px;width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.7);border:3px solid rgba(27,49,80,.5);display:grid;place-items:center;z-index:20}
.night{position:absolute;inset:0;background:rgba(20,34,70,.82);display:grid;place-items:center;z-index:40;animation:hintIn .6s}
/* Grown-up: the gear opens after a 1.5 s hold; the page lists each tour and task */
.gear{position:absolute;right:22px;bottom:18px;width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.75);border:3px solid rgba(27,49,80,.4);display:grid;place-items:center;z-index:20;overflow:hidden;touch-action:none}
.gear svg{position:relative;z-index:1}
.gear i{position:absolute;inset:0;border-radius:50%;background:conic-gradient(rgba(239,106,67,.6) var(--p),transparent 0)}
@property --p{syntax:'<percentage>';inherits:false;initial-value:0%}
.gear.holding i{animation:hold 1.5s linear forwards}
@keyframes hold{to{--p:100%}}
.adult{position:absolute;inset:0;background:var(--white);z-index:60;overflow:auto;padding:0 40px 40px;font-size:20px;display:flex;flex-direction:column;gap:26px;user-select:text;-webkit-user-select:text}
.adult .ahead{position:sticky;top:0;background:var(--white);display:flex;justify-content:space-between;align-items:center;padding:24px 0 12px;border-bottom:3px solid #e3ecf2;z-index:2}
.adult h2{margin:0;font-size:36px}.adult h3{margin:0 0 10px;font-size:24px}.adult h4{margin:10px 0 6px;font-size:20px}
.adult section{display:flex;flex-direction:column;gap:6px}
.adult .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.adult .chip{padding:8px 18px;border-radius:999px;border:3px solid var(--navy);background:#fff;font-weight:600;font-size:20px}
.adult .chip.on{background:var(--navy);color:var(--white)}
.adult input{font:inherit;padding:8px 14px;border:3px solid #c9dcea;border-radius:14px;width:220px}
.adult .abtn{font:600 20px var(--num);padding:10px 20px;border-radius:14px;border:3px solid var(--navy);background:#ffe9b8;box-shadow:0 4px 0 var(--navy)}
.adult .abtn.warn{background:#ffe2d8}
.adult .tw{overflow-x:auto}
.adult table{border-collapse:collapse;width:100%;font-size:19px}
.adult th,.adult td{text-align:left;padding:10px 12px;border-bottom:2px solid #e3ecf2;font-variant-numeric:tabular-nums;vertical-align:top}
.adult th{font-size:15px;letter-spacing:.04em;text-transform:uppercase;color:#4c6577}
.adult tr.s{cursor:pointer}.adult tr.s:hover td{background:#eef6fb}
.adult tr.det td{background:#f6fafc}
.adult .tasks{display:flex;flex-direction:column;gap:4px}
.adult .t{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.adult .q{min-width:190px;font-weight:600}
.adult .tap{display:inline-block;min-width:34px;padding:1px 8px;border-radius:8px;text-align:center;font-weight:700}
.adult .tap.ok{background:#c8f2d4}.adult .tap.no{background:#ffd5c7}
.adult .note{color:#4c6577;font-size:17px;margin:0}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
</style>

<div id="viewport"><div id="stage"></div></div>

<script>
/* ---------- Crabbi, drawn in code ----------
   The drawing is ChatGPT's code version of Steve's picture (fun-learning/art-reference/crabbi-chatgpt-code.html),
   kept exactly as drawn. Claude's part is the structure around it:
   - any number of Crabbis on one page (no shared ids), each with its own animation loop;
   - every move returns a promise that settles when the move is over, so a game can wait for it;
   - the claw attack strikes toward the foe on the right with the near claw (ChatGPT's swung the far claw across his face).
   CrabbiRig.mount(node) draws Crabbi into node and returns { attack(), hurt(), happy(), busy, stop() }.
   Idle is always on: breathing, the wave sways, the claws drift, the eyes blink. */
const CrabbiRig = (() => {
  let seq = 0, speed = 1;
  const CSS = `
.crabbi-rig{width:100%;height:100%;display:block;overflow:visible}
.crabbi-rig .ink{stroke:#513027;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.crabbi-rig .detail{stroke:#bd8c60;stroke-width:1.8;fill:none}
.crabbi-rig .closed{display:none}`;

  const svg = u => `<svg class="crabbi-rig" viewBox="130 100 680 430" preserveAspectRatio="xMidYMax meet" aria-hidden="true">
      <defs><filter id="${u}-hit" x="-10%" y="-10%" width="120%" height="120%"><feComponentTransfer>
        <feFuncR type="linear" slope="0" intercept="1"/><feFuncG type="linear" slope="0" intercept="1"/><feFuncB type="linear" slope="0" intercept="1"/>
      </feComponentTransfer></filter></defs>
      <ellipse data-p="ground-shadow" cx="447" cy="492" rx="231" ry="19"
      fill="#409ca9" opacity=".28"/>
      <g data-p="crabbi-motion">
      <g data-p="crabbi-breath" class="ink">
      <g data-p="legs">
      <g data-p="leg-rear-left">
      <path fill="#f17650"
      d="M360 420C321 407 287 419 277 445C268 466 270 479 277 487C288 488 319 462 333 451L371 445Z"/>
      <path fill="#c9573d" stroke="none"
      d="M283 443Q306 426 343 433L333 451Q304 472 277 487Q277 463 283 443"/>
      <path fill="#ffe8bc"
      d="M274 461Q285 450 301 454Q296 474 277 487Q270 482 274 461Z"/>
      </g>
      <g data-p="leg-rear-right">
      <path fill="#f47b52"
      d="M505 431C532 419 557 431 566 450Q575 470 564 485C552 482 538 461 526 453L504 452Z"/>
      <path fill="#ffe8bc"
      d="M543 460Q555 456 569 460Q572 476 564 485Q552 480 543 460Z"/>
      </g>
      <g data-p="leg-front-right">
      <path fill="#ff875c"
      d="M536 414C574 410 605 425 618 448Q635 474 627 491C613 492 583 469 563 456L533 448Z"/>
      <path fill="#db6446" stroke="none"
      d="M541 436Q579 439 599 462L627 491Q605 486 563 456L533 448Z"/>
      <path fill="#ffebc5"
      d="M600 461Q614 460 628 470Q632 482 627 491Q614 489 594 472Z"/>
      <path fill="#ffc09a" stroke="none"
      d="M558 422Q583 420 600 440Q581 431 562 434Z"/>
      </g>
      <g data-p="leg-front-left">
      <path fill="#ff865c"
      d="M374 414C341 405 313 423 302 447Q290 476 304 503C318 505 349 470 363 450L389 443Z"/>

const Q = new URLSearchParams(location.search);
const TEST = Q.has('test');            // marks the right answers for automated checks; never used by the boys
const SPEED = TEST ? 0.25 : 1;         // the test run waits less
const stage = document.getElementById('stage');
const wait = ms => new Promise(r => setTimeout(r, ms * SPEED));
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const shuffle = arr => { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; };
const h = html => { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; };

/* ---------- Fit the 1280x800 stage to the screen ---------- */
function fit() { const s = Math.min(innerWidth / 1280, innerHeight / 800); stage.style.transform = `scale(${s})`; }
addEventListener('resize', fit); fit();

/* ---------- Voice: Danish speech. Every line is a draft until Steve has heard it. ---------- */
const Voice = (() => {
  const api = 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window;
  let voice = null, last = '', ok = false;
  const listeners = [];
  function choose() {
    if (!api) return;
    const vs = speechSynthesis.getVoices();
    voice = vs.find(v => /^da/i.test(v.lang)) || null;
    ok = !!voice; listeners.forEach(f => f(ok));
  }
  if (api) { choose(); speechSynthesis.onvoiceschanged = choose; }
  return {
    get ok() { return ok; },
    onChange(f) { listeners.push(f); },
    // Resolves when the line has been said (or at once without a voice), so a screen can wait for it.
    say(text, { wait: w = false } = {}) {
      last = text;
      if (!api || TEST) return Promise.resolve();
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'da-DK'; if (voice) u.voice = voice; u.rate = 0.95; u.pitch = 1.1;
      const done = new Promise(r => { u.onend = r; u.onerror = r; setTimeout(r, 1200 + text.length * 90); });
      speechSynthesis.speak(u);
      return w ? done : Promise.resolve();
    },
    again() { if (last) this.say(last); }
  };
})();

/* ---------- Little sounds, made in the browser (no files) ---------- */
const Sfx = (() => {
  let ctx = null;
  const tone = (f, t0, dur, type = 'sine', vol = .16) => {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.value = f; o.connect(g); g.connect(ctx.destination);
    const t = ctx.currentTime + t0; g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .02); g.gain.exponentialRampToValueAtTime(.001, t + dur);
    o.start(t); o.stop(t + dur + .05);
  };
  const go = f => { try { ctx = ctx || new (window.AudioContext || window.webkitAudioContext)(); if (ctx.state === 'suspended') ctx.resume(); f(); } catch (e) { /* no sound is fine */ } };
  return {
    right: () => go(() => { tone(660, 0, .15); tone(990, .1, .22); }),
    miss: () => go(() => { tone(220, 0, .2, 'triangle', .12); }),
    pop: () => go(() => { tone(880, 0, .08, 'square', .05); }),

// Wait for the right answer. A wrong tap costs nothing: it shows the how, then that choice fades out (L2).
function ask(els, right, { wrong, help, helpEl, onTap, log = '' } = {}) {
  if (TEST) els.forEach(el => { delete el.dataset.ok; if (+el.dataset.v === right) el.dataset.ok = '1'; });

  return new Promise(resolve => {
    let locked = false, misses = 0;
    els.forEach(el => el.onclick = async () => {
      if (locked || el.classList.contains('out')) return;
      locked = true;
      const v = +el.dataset.v;
      Log.tap(v);
      if (onTap) await onTap(v, el);
      if (v === right) { el.classList.add('right'); els.forEach(e => delete e.dataset.ok); Sfx.right(); Log.taskDone(); resolve({ misses }); return; }
      misses++; Sfx.miss(); el.classList.add('miss');
      if (wrong) await wrong(v, el, misses);
      el.classList.remove('miss'); el.classList.add('out');
      locked = false;
    });
    if (helpEl) helpEl.onclick = async () => { if (locked) return; locked = true; Log.help(); if (help) await help(); locked = false; };
  });
}

// Answer choices: the right one, plus near misses and the classic slip (the other operation, or the digits swapped).
function choices(right, slips, { min = 0, max = 20, count = 3 } = {}) {
  const out = [right];
  const add = x => { if (out.length < count && Number.isInteger(x) && x >= min && x <= max && !out.includes(x)) out.push(x); };
  slips.forEach(add);
  shuffle([right + 1, right - 1, right + 2, right - 2]).forEach(add);
  [right + 10, right - 10, right + 3].forEach(add);
  return shuffle(out);
}

/* ---------- The how: a number line with hops ---------- */
// from, by (negative = backwards). Returns an SVG element; call .play() to draw the hops one by one.
function numberLine(from, by, { w = 760, hgt = 150, label = true } = {}) {
  const to = from + by, lo = Math.min(from, to) - 1, hi = Math.max(from, to) + 1;
  const n = hi - lo, pad = 30, step = (w - 2 * pad) / n, X = v => pad + (v - lo) * step, base = hgt - 50;
  let s = `<svg viewBox="0 0 ${w} ${hgt}" xmlns="http://www.w3.org/2000/svg">`;
  s += `<line x1="${pad - 10}" y1="${base}" x2="${w - pad + 10}" y2="${base}" stroke="#1b3150" stroke-width="5" stroke-linecap="round"/>`;
  for (let v = lo; v <= hi; v++) {
    const big = v % 5 === 0;
    s += `<line x1="${X(v)}" y1="${base - (big ? 14 : 9)}" x2="${X(v)}" y2="${base + (big ? 14 : 9)}" stroke="#1b3150" stroke-width="${big ? 4 : 3}"/>`;
    s += `<text data-n="${v}" x="${X(v)}" y="${base + 44}" text-anchor="middle" font-family="Fredoka,sans-serif" font-weight="700" font-size="${v === from ? 32 : 26}" fill="${v === from ? '#ef6a43' : '#1b3150'}">${v}</text>`;
  }
  const dir = Math.sign(by) || 1;
  for (let i = 0; i < Math.abs(by); i++) {
    const a = X(from + i * dir), b = X(from + (i + 1) * dir), m = (a + b) / 2;
    s += `<path data-hop="${i}" d="M${a} ${base - 6} Q${m} ${base - 62} ${b} ${base - 6}" fill="none" stroke="#ef6a43" stroke-width="5" stroke-linecap="round" opacity="0"/>`;
    if (label) s += `<text data-hl="${i}" x="${m}" y="${base - 46}" text-anchor="middle" font-family="Fredoka,sans-serif" font-weight="600" font-size="20" fill="#c94c29" opacity="0">${i + 1}</text>`;
  }
  s += `<circle data-start cx="${X(from)}" cy="${base}" r="12" fill="#ef6a43" stroke="#1b3150" stroke-width="3"/>`;
  s += `<circle data-land cx="${X(to)}" cy="${base}" r="0" fill="#ffd84a" stroke="#1b3150" stroke-width="4"/></svg>`;
  const el = h(s);
  el.play = async (gap = 380) => {
    for (let i = 0; i < Math.abs(by); i++) {
      await wait(gap);
      const p = el.querySelector(`[data-hop="${i}"]`), len = p.getTotalLength();
      p.setAttribute('opacity', '1'); p.style.strokeDasharray = len; p.style.strokeDashoffset = len;
      p.animate([{ strokeDashoffset: len }, { strokeDashoffset: 0 }], { duration: 260 * SPEED, fill: 'forwards' });
      const t = el.querySelector(`[data-hl="${i}"]`); if (t) t.setAttribute('opacity', '1');
      Sfx.pop();
    }
    await wait(300);
    const land = el.querySelector('[data-land]'); land.setAttribute('r', '16');
    const lt = el.querySelector(`[data-n="${to}"]`); if (lt) { lt.setAttribute('fill', '#c94c29'); lt.setAttribute('font-size', '34'); }
  };
  return el;
}

// Tens and ones: bars of ten and loose dots, counted up.
function tensOnes(tens, ones, { w = 760, hgt = 180 } = {}) {
  const t = tens / 10; let s = `<svg viewBox="0 0 ${w} ${hgt}" xmlns="http://www.w3.org/2000/svg">`;
  for (let i = 0; i < t; i++) {

    s += `<text x="${x + 18}" y="${hgt - 14}" text-anchor="middle" font-family="Fredoka,sans-serif" font-weight="700" font-size="24" fill="#1b3150">${(i + 1) * 10}</text></g>`;
  }

    s += `<g data-dot="${k}" opacity=".25"><circle cx="${ox + (k % 5) * 40}" cy="${46 + Math.floor(k / 5) * 46}" r="15" fill="#ffd84a" stroke="#1b3150" stroke-width="3"/>`;

  }

  el.play = async () => {
    for (let i = 0; i < t; i++) { await wait(450); el.querySelector(`[data-bar="${i}"]`).setAttribute('opacity', '1'); Sfx.pop(); }

/* ---------- Maths for this tour ----------
   Plus and minus within 20 is solid for the boys (school book analysis, 2026-11-08), so the stops use it,
   with friends of 10 and 20 for Boblo, tens and ones to count fish, and the catch uses the next thing in the book:
   tens plus ones to 100 ("styrke, ikke klasser": no grade labels anywhere). */
function kloenItems() {
  const plus = () => { const a = rnd(4, 12), b = rnd(3, 9); return a + b <= 20 ? { a, b, op: '+' } : plus(); };
  const minus = () => { const a = rnd(11, 19), b = rnd(3, 9); return { a, b, op: '-' }; };
  return [plus(), minus(), plus(), minus(), plus()];
}
const resultOf = it => it.op === '+' ? it.a + it.b : it.a - it.b;
function routes() {
  const r1s = rnd(4, 8), r2s = rnd(14, 18), r3s = rnd(12, 16);
  return [
    [{ from: r1s, to: 10 }, { from: 10, to: 10 + rnd(3, 7) }],
    [{ from: r2s, to: 20 }, { from: 20, to: 20 + rnd(2, 6) }],
    [{ from: r3s, to: 10 }, { from: 10, to: 10 - rnd(2, 5) }]
  ];
}
function netItems() {
  const seen = new Set(), out = [];
  const plan = [[1, rnd(2, 8)], [2, rnd(1, 9)], [3, rnd(1, 9)], [2, rnd(1, 9)]];
  for (let [t, o] of plan) { if (o === t) o = o === 9 ? 8 : o + 1; while (seen.has(t * 10 + o)) o = o === 9 ? 1 : o + 1; seen.add(t * 10 + o); out.push({ tens: t, ones: o }); }
  return out;
}
// Each foe has its favourite maths (design: "Hver fjende har sin yndlings-matematik").
const plusItem = () => { const a = rnd(6, 12), b = rnd(4, 9); return a + b <= 20 && a + b > 10 ? { kind: 'op', a, b, op: '+' } : plusItem(); };
const minusItem = () => { const a = rnd(12, 19), b = rnd(3, 9); return { kind: 'op', a, b, op: '-' }; };
const FIGHT_ITEMS = {
  // Boblo: numbers that make 10 and 20 ("Hvilke to bobler giver 20?")
  boblo: () => [plusItem(), { kind: 'friend', a: rnd(2, 8), goal: 10 }, minusItem(), { kind: 'friend', a: rnd(12, 18), goal: 20 }],
  // Blæksi: share out evenly, double and half
  blaeksi: () => { const d = rnd(3, 9); return [{ kind: 'op', a: d, b: d, op: '+', double: true }, { kind: 'half', n: 2 * rnd(3, 9) }, plusItem(), { kind: 'half', n: 2 * rnd(2, 10) }]; },
  // Glødi: the light blinks sums and some are fibs. True or false?
  glodi: () => [plusItem(), tfItem(), minusItem(), tfItem()]
};
function tfItem() { const it = Math.random() < .5 ? plusItem() : minusItem(); const r = resultOf(it); const truth = Math.random() < .5; return { ...it, kind: 'tf', shown: truth ? r : r + pick([-2, -1, 1, 2]), truth }; }
function fightItems(foe) { const out = []; for (let i = 0; i < 4; i++) out.push(...FIGHT_ITEMS[foe]()); return out; }
function catchItems() {
  const tens = shuffle([20, 30, 40, 50]).slice(0, 3);
  return tens.map(t => { let o = rnd(1, 9); if (o === t / 10) o = o === 9 ? 8 : o + 1; return { t, o }; });
}

/* ---------- 4 · Kampen: right answers are Crabbi's attacks. A miss costs nothing. ---------- */
/* ---------- 4 · Kampen: right answers are Crabbi's attacks. A miss costs nothing. ----------
   Colours: blue beats orange, orange beats green, green beats blue. Crabbi is orange, so his hits count double
   while the foe is green. Halfway every foe changes colour once: Boblo and Glødi turn green (Crabbi hits double),
   Blæksi starts green and turns blue (no more double hits, and its punches sting a little more). */
function halfDots(n, { w = 600, hgt = 170 } = {}) {
  const k = n / 2, gap = Math.min(54, (w - 80) / k), r = Math.min(18, gap / 2 - 4);
  let s = `<svg viewBox="0 0 ${w} ${hgt}" xmlns="http://www.w3.org/2000/svg">`;
  for (let row = 0; row < 2; row++) for (let i = 0; i < k; i++)
    s += `<circle data-d="${row}-${i}" cx="${50 + i * gap}" cy="${34 + row * 58}" r="${r}" fill="${row ? '#62bafa' : '#ffd84a'}" stroke="#1b3150" stroke-width="3" opacity=".15"/>`;
  for (let i = 0; i < k; i++) s += `<text data-t="${i}" x="${50 + i * gap}" y="${hgt - 14}" text-anchor="middle" font-family="Fredoka,sans-serif" font-weight="700" font-size="24" fill="#1b3150" opacity="0">${i + 1}</text>`;
  const el = h(s + '</svg>');
  el.play = async () => {
    for (let i = 0; i < k; i++) { await wait(140); el.querySelector(`[data-d="0-${i}"]`).setAttribute('opacity', '1'); el.querySelector(`[data-d="1-${i}"]`).setAttribute('opacity', '1'); }
    for (let i = 0; i < k; i++) { await wait(320); el.querySelector(`[data-t="${i}"]`).setAttribute('opacity', '1'); Sfx.pop(); }
  };
  return el;
}

  const setCol = () => { const t = el.querySelector('#fFoeCol'); t.textContent = COL[col].word; t.style.background = COL[col].bg; x2.classList.toggle('on', col === 'green'); };
  const box = (t, c = '') => `<span class="box ${c}">${t}</span>`, arr = '<span class="arr">→</span>';
  // Up to 3 answer buttons; unused ones are hidden. labels (HTML) replace the numbers, as in true/false.
  const setBtns = (opts, labels) => btns.forEach((b, k) => {
    b.className = 'btn'; b.style.visibility = '';
    if (k < opts.length) { b.innerHTML = labels ? labels[k] : opts[k]; b.dataset.v = opts[k]; }
    else { b.textContent = ''; delete b.dataset.v; b.style.visibility = 'hidden'; }
  });
  const hintInTask = async (svg) => { const w = h('<div class="hint-in"></div>'); w.appendChild(svg); task.appendChild(w); await svg.play(); };
  const opWord = o => o === '+' ? 'plus' : 'minus', opSign = o => o === '+' ? '+' : '−';
  const lineHint = (from, by, line) => () => { Voice.say(line); return hintInTask(numberLine(from, by, { w: 600, hgt: 170 })); };
  setCol();

  el.querySelector('.b-stage').animate([{ opacity: 0 }, { opacity: 1 }], { duration: 400 });
  await Voice.say(`${F.name} vil kæmpe! Rigtige svar er Crabbis angreb.`, { wait: true });
  if (col === 'green') await Voice.say(`${F.name} er grøn. Orange slår grøn, så Crabbi slår dobbelt!`, { wait: true });
  const items = fightItems(FOE_TODAY);
  while (foeHP > 0) {
    const it = items[turns % items.length]; turns++;
    let right, say, hint, log;
    if (it.kind === 'op') {
      right = resultOf(it);
      task.innerHTML = box(it.a) + arr + box(opSign(it.op) + it.b, 'claw') + arr + box('?');
      setBtns(choices(right, [it.op === '+' ? it.a - it.b : it.a + it.b]));
      say = it.double ? `Dobbelt op! ${it.a} plus ${it.a}.` : `${it.a} ${opWord(it.op)} ${it.b}.`;
      hint = lineHint(it.a, it.op === '+' ? it.b : -it.b, `Start på ${it.a}. Hop ${it.b} ${it.op === '+' ? 'frem' : 'tilbage'}.`);
      log = `${it.a} ${opSign(it.op)} ${it.b}`;
    } else if (it.kind === 'friend') {
      right = it.goal - it.a;
      task.innerHTML = box(it.a) + arr + box('+?', 'claw') + arr + box(it.goal, 'gold');
      setBtns(choices(right, [right + 1], { min: 1, max: 19 }));
      say = `${it.a} plus hvad giver ${it.goal}?`;
      hint = lineHint(it.a, right, `Fra ${it.a} til ${it.goal}. Tæl hoppene.`);
      log = `${it.a} + ? = ${it.goal}`;
    } else if (it.kind === 'half') {
      right = it.n / 2;
      task.innerHTML = box(it.n) + arr + box('½', 'claw') + arr + box('?');
      setBtns(choices(right, [it.n, right + 1], { min: 1, max: 20 }));
      say = `Del ${it.n} lige i to. Hvor mange får hver?`;
      hint = () => { Voice.say(`${it.n} delt i to lige lange rækker. Tæl den ene række.`); return hintInTask(halfDots(it.n)); };
      log = `halvdelen af ${it.n}`;
    } else {
      right = it.truth ? 1 : 0;
      task.innerHTML = box(it.a) + `<span class="arr">${opSign(it.op)}</span>` + box(it.b) + '<span class="arr">=</span>' + box(it.shown, 'gold');
      setBtns([1, 0], ['<svg width="64" height="64"><use href="#yes"/></svg>', '<svg width="64" height="64"><use href="#no"/></svg>']);
      say = `${it.a} ${opWord(it.op)} ${it.b} er ${it.shown}. Passer det?`;
      hint = lineHint(it.a, it.op === '+' ? it.b : -it.b, `${it.a} ${opWord(it.op)} ${it.b}. Hop og se, hvor du lander.`);
      log = `${it.a} ${opSign(it.op)} ${it.b} = ${it.shown}?`;
    }
    Voice.say(say);
    await ask(btns, right, { log, helpEl: help, help: hint, wrong: async () => { await hint(); } });
    task.querySelector('.hint-in')?.remove();
    // Crabbi attacks.
    Voice.say(praise());
    crab.attack(); await wait(780);
    foeHP = Math.max(0, foeHP - (col === 'green' ? 2 : 1)); setFoe();
    await foe.hurt(); await wait(300);
    if (!shifted && foeHP <= MAX / 2 && foeHP > 0) {
      shifted = true; col = F.shift;
      await Voice.say(`Hov! ${F.name} skifter farve.`, { wait: true });
      await foe.setColour(col, { shimmer: true }); setCol();
      await Voice.say(col === 'green' ? 'Nu er han grøn. Orange slår grøn, så Crabbi slår dobbelt!' : 'Nu er han blå. Blå slår orange, så Crabbi slår ikke dobbelt mere. Bliv ved!', { wait: true });
    } else if (foeHP > 0 && turns % 2 === 0) {
      // The foe's turn. It never empties Crabbi's bar, and never depends on a miss.
      Voice.say(F.punch);
      foe.attack(); await wait(430); crab.hurt();
      crabHP = Math.max(40, crabHP - (col === 'blue' ? 20 : 15)); crabBar.style.width = crabHP + '%';
      await wait(900);
    }
  }
  Log.endStop();
  await foe.dizzy(true);
  await Voice.say(`${F.name} er svimmel! Nu kan du fange ham. Tre opgaver.`, { wait: true });
  return catchPart(el, crab, foe);
}

/* ---------- 5 · The catch: 3 tasks he has not practised. 2 of 3 right and the foe is caught; if not, it comes back another day. ---------- */
async function catchPart(el, crab, foe) {
  const F = F_TODAY, items = catchItems(), rings = [...el.querySelectorAll('#fRings i')];
  const task = el.querySelector('#fTask'), btns = [...el.querySelectorAll('.btn:not(.hintb)')], help = el.querySelector('.hintb');
  el.querySelector('#fRings').hidden = false;
  Log.stop('Fangst');
  let got = 0;
  for (let i = 0; i < items.length; i++) {
    const { t, o } = items[i], right = t + o;
    task.innerHTML = `<span class="box">${t}</span><span class="arr">+</span><span class="box claw">${o}</span><span class="arr">→</span><span class="box">?</span>`;
    choices(right, [o * 10 + t / 10, right + 10], { min: 1, max: 99 }).forEach((v, k) => { btns[k].textContent = v; btns[k].dataset.v = v; btns[k].className = 'btn'; btns[k].style.visibility = ''; });
    Voice.say(`${t} plus ${o}.`);
    Log.task(`${t} + ${o}`, right);
    // One try per catch task. A miss shows the how and costs no health, but that ring stays empty.
    const res = await new Promise(resolve => {
      let locked = false;
      if (TEST) btns.forEach(b => { delete b.dataset.ok; if (+b.dataset.v === right) b.dataset.ok = '1'; });
      const showHow = async () => {
        const w = h('<div class="hint-in"></div>'), svg = tensOnes(t, o, { w: 600, hgt: 190 }); w.appendChild(svg); task.appendChild(w);
        Voice.say(`${t} er ${t / 10} tiere. Plus ${o} er ${right}.`);
        await svg.play(); await wait(900);
      };
      help.onclick = async () => { if (locked) return; locked = true; Log.help(); await showHow(); task.querySelector('.hint-in')?.remove(); locked = false; };
      btns.forEach(b => b.onclick = async () => {
        if (locked) return; locked = true;
        const ok = +b.dataset.v === right;
        Log.tap(+b.dataset.v);
        btns.forEach(e => delete e.dataset.ok);
        if (ok) { b.classList.add('right'); Sfx.right(); resolve(true); return; }
        Sfx.miss(); b.classList.add('miss'); await showHow(); resolve(false);
      });
    });
    Log.taskDone();
    task.querySelector('.hint-in')?.remove();
    if (res) { got++; rings[i].classList.add('got'); burst(rect(rings[i]).x, rect(rings[i]).y, 5); Voice.say(praise()); crab.attack(); await wait(780); await foe.hurt(); }
    else { rings[i].classList.add('lost'); foe.dizzy(true); }
    await wait(1100);
  }
  Log.endStop();
  task.innerHTML = '';
  btns.forEach(b => { b.textContent = ''; b.onclick = null; }); help.onclick = null;
  if (got >= 2) {
    await foe.caught(); Sfx.win(); crab.happy(); burst(1020, 230, 10);
    await Voice.say(`Du fangede ${F.name}! Han kommer i Crabbis bog.`, { wait: true });
    return true;
  }
  foe.dizzy(false); await foe.run();
  await Voice.say(`Åh, ${F.name} smuttede. Han kommer igen en anden dag. Det var tæt på!`, { wait: true });
  return false;
}

/* ---------- 6 · Stop for today ---------- */
async function endScreen(caught) {
  const F = F_TODAY;
  const el = await show(`<div class="screen">
    <div class="bg" data-bg="beach"></div>
    <div class="stars">${[0, 1, 2].map(() => '<svg width="70" height="70"><use href="#star"/></svg>').join('')}<svg width="70" height="70" style="margin-left:6px"><use href="#bolt"/></svg></div>
    <div class="crab" id="eCrab" style="left:120px;top:300px;width:460px;height:290px"></div>
    <div class="book ${caught ? '' : 'ghost'}"><div class="slot"><div class="foe-rig" id="eFoe" style="inset:20px 30px 6px 30px"></div></div>
      <div class="nm">${F.name}</div>${caught ? '<div class="stamp"><svg width="50" height="50"><use href="#check"/></svg></div>' : ''}</div>
    <button class="done-btn" aria-label="Færdig"><svg width="64" height="64"><use href="#check"/></svg></button>
    ${speakerHTML()}
    <button class="gear" style="right:86px" aria-label="Voksen: hold inde"><svg width="30" height="30"><use href="#gearI"/></svg><i></i></button>
    <button class="replay" aria-label="Spil igen (voksen)"><svg width="30" height="30"><use href="#redo"/></svg></button>
  </div>`);
  bg(el);
  const crab = CrabbiRig.mount(el.querySelector('#eCrab'));
  FoeRig.mount(el.querySelector('#eFoe'), FOE_TODAY);
  wireGear(el.querySelector('.gear'));
  el.querySelectorAll('.stars svg').forEach((s, i) => s.animate([{ transform: 'scale(0)' }, { transform: 'scale(1.25)' }, { transform: 'scale(1)' }], { duration: 450 * SPEED, delay: i * 250 * SPEED, fill: 'backwards' }));
  await wait(700); crab.happy(); Sfx.win();
  el.querySelector('.stamp')?.classList.add('on');
  Voice.say(caught ? `Godt klaret i dag! ${F.name} er i Crabbis bog. Vi ses i morgen.` : `Godt klaret i dag! ${F.name} kommer igen i morgen. Vi ses.`);
  el.querySelector('.replay').onclick = () => location.reload();
  await new Promise(r => el.querySelector('.done-btn').onclick = r);
  stage.appendChild(h(`<div class="night"><svg width="160" height="160" viewBox="0 0 40 40"><path d="M26 6a14 14 0 1 0 8 22A12 12 0 0 1 26 6z" fill="#ffd84a" stroke="#fffdf8" stroke-width="1.5"/></svg></div>`));
  Voice.say('Vi ses i morgen, Crabbi!');
}

/* ---------- Grown-up page: hold the small gear for 1.5 seconds. Shows what each child did; nothing leaves the tablet. ---------- */
function wireGear(btn) {
  let timer = 0;
  const stop = () => { clearTimeout(timer); btn.classList.remove('holding'); };
  btn.addEventListener('pointerdown', e => { e.preventDefault(); btn.classList.add('holding'); timer = setTimeout(() => { stop(); openAdult(); }, TEST ? 50 : 1500); });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(t => btn.addEventListener(t, stop));
  btn.addEventListener('contextmenu', e => e.preventDefault());
}
function openAdult() {
  const db = Log.db;
  const mmss = s => s == null ? '–' : `${Math.floor(s / 60)}:${String(Math.round(s) % 60).padStart(2, '0')}`;
  const when = iso => new Date(iso).toLocaleString('da-DK', { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
  const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const tapLabel = (task, v) => task.text.endsWith('?') && (v === 0 || v === 1) ? (v ? '✓' : '✗') : (task.text.includes('→') && v > 0 ? '+' + v : v);
  const ov = h('<div class="adult" role="dialog" aria-label="Voksenside"></div>');
  let open = -1, confirmDelete = false;
  const render = () => {
    const list = db.sessions.map((x, i) => ({ x, i })).reverse();
    const rows = list.map(({ x, i }) => {
      const tasks = x.stops.flatMap(st => st.tasks).filter(t => t.taps.length);
      const first = tasks.filter(t => t.first).length, helps = tasks.reduce((n, t) => n + t.help, 0);
      const result = x.done ? (x.caught ? 'Fanget' : 'Slap væk') : 'Ikke færdig';
      let html = `<tr class="s" data-i="${i}"><td>${when(x.at)}</td><td>${esc(x.player)}</td><td>${FOE[x.foe]?.name || x.foe}</td><td>${mmss(x.secs)}</td><td>${first} af ${tasks.length}</td><td>${helps}</td><td>${result}</td></tr>`;
      if (open === i) {
        html += `<tr class="det"><td colspan="7">` + x.stops.map(st => `<h4>${st.name} <span class="note">${mmss(st.secs)}</span></h4><div class="tasks">` +
          st.tasks.filter(t => t.taps.length).map(t => `<div class="t"><span class="q">${esc(t.text)}</span>` +
            t.taps.map(v => `<span class="tap ${v === t.right ? 'ok' : 'no'}">${tapLabel(t, v)}</span>`).join('') +
            (t.help ? `<span class="note">hjælp ×${t.help}</span>` : '') + `<span class="note">${t.secs ?? '–'} s</span></div>`).join('') + '</div>').join('') + `</td></tr>`;
      }
      return html;
    }).join('');
    const book = ORDER.map(f => `<span class="chip ${db.book[f] ? 'on' : ''}">${FOE[f].name}${db.book[f] ? ' ×' + db.book[f] : ''}</span>`).join('');
    ov.innerHTML = `<div class="ahead"><h2>Voksenside</h2><button class="abtn" data-a="close">Luk</button></div>
      <section><h3>Hvem spiller?</h3><div class="row">${db.players.map(p => `<button class="chip ${p === db.player ? 'on' : ''}" data-p="${esc(p)}">${esc(p)}</button>`).join('')}
        <input id="newPlayer" placeholder="Nyt navn" maxlength="20" autocomplete="off"><button class="abtn" data-a="add">Tilføj</button></div>
        <p class="note">Vælg barnet, før turen starter. Det næste spil bliver gemt under det navn.</p></section>
      <section><h3>Crabbis bog</h3><div class="row">${book}${db.escaped ? `<span class="note">Kommer igen: ${FOE[db.escaped.foe]?.name}</span>` : ''}</div></section>
      <section><h3>Ture</h3>${list.length ? `<div class="tw"><table><thead><tr><th>Hvornår</th><th>Spiller</th><th>Fjende</th><th>Tid</th><th>Rigtigt første gang</th><th>Hjælp</th><th>Fangst</th></tr></thead><tbody>${rows}</tbody></table></div><p class="note">Tryk på en tur for at se hver opgave. Grøn er rigtigt, rød er et forkert tryk.</p>` : '<p class="note">Ingen ture endnu. Når en tur er spillet, står den her.</p>'}</section>
      <section class="row"><button class="abtn" data-a="file">Gem som fil</button><button class="abtn warn" data-a="del">${confirmDelete ? 'Tryk igen for at slette alle ture' : 'Slet alle ture'}</button></section>
      <p class="note">Alt bliver på denne tablet. Intet sendes nogen steder hen.</p>`;
  };
  ov.addEventListener('click', e => {
    const row = e.target.closest('tr.s'), chip = e.target.closest('[data-p]'), a = e.target.closest('[data-a]')?.dataset.a;
    if (row) { open = open === +row.dataset.i ? -1 : +row.dataset.i; render(); return; }
    if (chip) { db.player = chip.dataset.p; Log.save(); render(); return; }
    if (a === 'close') { ov.remove(); return; }
    if (a === 'add') { const v = ov.querySelector('#newPlayer').value.trim(); if (v && !db.players.includes(v)) db.players.push(v); if (v) db.player = v; Log.save(); render(); return; }
    if (a === 'file') {
      const blob = new Blob([JSON.stringify(db, null, 2)], { type: 'application/json' });
      const link = document.createElement('a'); link.href = URL.createObjectURL(blob); link.download = `crabbis-tur-${dayKey()}.json`; document.body.appendChild(link); link.click(); link.remove();
      return;
    }
    if (a === 'del') { if (!confirmDelete) { confirmDelete = true; render(); return; } db.sessions = []; db.book = {}; db.escaped = null; confirmDelete = false; Log.save(); render(); }
  });
  render(); stage.appendChild(ov);
}

/* ---------- Run the tour. ?at=kloen|ruten|nettet|kamp|slut jumps ahead and ?foe=boblo|blaeksi|glodi picks the foe, for testing. ---------- */
async function tour() {
  const at = Q.get('at');
  const order = ['map', 'kloen', 'ruten', 'nettet', 'kamp', 'slut'];
  const from = Math.max(0, order.indexOf(at));
  if (from <= 0) await mapScreen(); else Log.start(FOE_TODAY);
  if (from <= 1) await kloenStop();
  if (from <= 2) await rutenStop();
  if (from <= 3) await nettetStop();
  const caught = from <= 4 ? await fightStop() : Q.get('caught') !== '0';
  if (caught) { Log.db.book[FOE_TODAY] = (Log.db.book[FOE_TODAY] || 0) + 1; if (Log.db.escaped?.foe === FOE_TODAY) Log.db.escaped = null; }
  else Log.db.escaped = { foe: FOE_TODAY, day: TODAY };
  Log.finish({ caught });
  await endScreen(caught);
}

window.__tour = { done: tour() };
})();
</script>
